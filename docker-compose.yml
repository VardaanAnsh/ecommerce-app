services:

  app1:
    build: .
    environment:
      APP_INSTANCE: app1
      MONGODB_URI: ${MONGODB_URI}
      EXPRESS_SESSION_SECRET: ${EXPRESS_SESSION_SECRET}
      JWT_KEY: ${JWT_KEY}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis

  app2:
    build: .
    environment:
      APP_INSTANCE: app2
      MONGODB_URI: ${MONGODB_URI}
      EXPRESS_SESSION_SECRET: ${EXPRESS_SESSION_SECRET}
      JWT_KEY: ${JWT_KEY}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis

  app3:
    build: .
    environment:
      APP_INSTANCE: app3
      MONGODB_URI: ${MONGODB_URI}
      EXPRESS_SESSION_SECRET: ${EXPRESS_SESSION_SECRET}
      JWT_KEY: ${JWT_KEY}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
  
  redis:
    image: redis:7-alpine

volumes:
  mongo_data: